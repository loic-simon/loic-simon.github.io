<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Loïc Simon" />
    <title>Loïc Simon</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔫</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-primary: #0a0e1a;
        --bg-secondary: #141925;
        --bg-tertiary: #1e2533;
        --accent-primary: #6366f1;
        --accent-secondary: #8b5cf6;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border-color: #2d3748;
        --success: #10b981;
        --warning: #f59e0b;
        --shadow: rgba(0, 0, 0, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Outfit", sans-serif;
        background: linear-gradient(135deg, var(--bg-primary) 0%, #0f1419 100%);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
      }

      .container {
        max-width: 650px;
        margin: 0 auto;
        padding: 2rem;
      }

      header {
        text-align: center;
        padding: 1rem 0 1rem;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent-secondary);
        font-family: "Funnel Display";
      }

      .subtitle {
        font-size: 1.1rem;
        color: var(--text-secondary);
        max-width: 600px;
        margin: 0 auto 1rem;
      }

      .links {
        font-size: 1.2rem;
        color: var(--accent-primary);
        max-width: 600px;
        margin: 1rem auto 0.5rem;
      }

      .links > a {
        color: var(--accent-primary);
      }

      .card {
        background: var(--bg-secondary);
        border-radius: 1rem;
        border: 1px solid var(--border-color);
        overflow: hidden;
        box-shadow: 0 8px 32px var(--shadow);
        padding: 1rem;
        font-size: smaller;
      }

      .card-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--bg-tertiary);
      }

      .card-title {
        margin-bottom: 1rem;
      }

      .card-body {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Loïc Simon</h1>
        <p class="subtitle">c'est moi ⬆️ bonjour 👋</p>
      </header>

      <div class="card">
        <p class="card-title">Présentation PyCon FR 2026 :</p>
        <div class="card-body">
          <a
            href="https://github.com/loic-simon/pyconfr26-migrations/blob/main/pyconfr26_migrer_les_donnees_dune_application_web.pdf"
          >
            <img
              src="./pycon_slides.png"
              width="85%"
              title="Migrer les données d'une application Web... sans que tout explose"
            />
          </a>
          <p class="links">
            <a
              href="https://github.com/loic-simon/pyconfr26-migrations/blob/main/pyconfr26_migrer_les_donnees_dune_application_web.pdf"
            >
              La présentation
            </a>
            <br />
            <a href="https://github.com/loic-simon/pyconfr26-migrations">Le repo de démonstration</a>
            <br />
            <a href="https://pypi.org/p/comdab" target="_blank">comdab</a>
          </p>
        </div>
      </div>
    </div>
    <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 2rem">
      <a href="https://github.com/loic-simon" title="Mon GitHub" target="_blank">
        <img src="./github-dark.svg" height="30" style="filter: invert()" />
      </a>
      <a href="https://linkedin.com/in/loic-simon" title="Mon LinkedIn" target="_blank">
        <img src="./linkedin-plain.svg" height="30" style="filter: invert()" />
      </a>
      <a href="https://napta.io" title="Napta (mon employeur)" target="_blank">
        <img src="./napta.png" height="29" style="filter: grayscale() brightness(100)" />
      </a>
    </div>
  </body>
</html>
